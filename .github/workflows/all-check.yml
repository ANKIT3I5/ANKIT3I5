name: WHITE AI ALL CHECK

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: white-ai-all-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-check:
    name: Backend syntax, dependency and code audit (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: white-ai-mvp-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: white-ai-mvp-backend/requirements.txt
      - name: Install backend dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit bandit
      - name: Compile Python source
        run: python -m compileall -q app
      - name: Audit Python dependencies (blocking)
        run: python -m pip_audit -r requirements.txt
      - name: Scan Python code (blocking)
        run: bandit -q -r app -ll
      - name: Run tests when present
        shell: bash
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pip install pytest
            python -m pytest -q
          else
            echo "::warning::No automated Python test files were found. Backend test coverage is incomplete."
            echo "- Backend tests: **NOT CONFIGURED** (no test files found)" >> "$GITHUB_STEP_SUMMARY"
          fi

  android-check:
    name: Android dependency audit and Expo diagnostics (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: white-ai-mvp-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: white-ai-mvp-android/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production dependencies (blocking, no suppressions)
        run: npm audit --omit=dev --audit-level=high
      - name: Run Expo Doctor
        run: npm run doctor

  module-inventory:
    name: Module completeness inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Report implemented and planned modules
        shell: bash
        run: |
          mkdir -p reports
          {
            echo "# WHITE AI module inventory"
            echo
            echo "| Module | Path | Status |"
            echo "|---|---|---|"
            for entry in \
              "Android app|white-ai-mvp-android" \
              "Backend API|white-ai-mvp-backend" \
              "DNS module|white-ai-dns" \
              "RF simulation|white-ai-rf-simulation" \
              "VPN module|white-ai-vpn" \
              "Documentation|docs"; do
              label="${entry%%|*}"
              path="${entry#*|}"
              if [ -d "$path" ]; then
                echo "| $label | `$path/` | PRESENT, needs module-specific tests |"
              else
                echo "| $label | `$path/` | NOT FOUND / NOT IMPLEMENTED |"
              fi
            done
            echo
            echo "A directory being present does not prove the module is functional. Hardware-dependent RF tests are not run on GitHub-hosted runners."
          } | tee reports/module-inventory.md
          cat reports/module-inventory.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload inventory report
        uses: actions/upload-artifact@v4
        with:
          name: white-ai-module-inventory
          path: reports/module-inventory.md
          if-no-files-found: error
          retention-days: 14
      - name: Enforce planned module completeness (blocking)
        shell: bash
        run: |
          missing=0
          for path in white-ai-mvp-android white-ai-mvp-backend white-ai-dns white-ai-rf-simulation white-ai-vpn docs; do
            if [ ! -d "$path" ]; then
              echo "::error::Required project module directory is missing: $path"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "ALL CHECK is incomplete. Implement or add the missing module directories and their tests; do not bypass this gate."
            exit 1
          fi

  all-check-summary:
    name: ALL CHECK result
    if: always()
    needs: [secret-scan, python-check, android-check, module-inventory]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize all check jobs
        env:
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          PYTHON_CHECK: ${{ needs.python-check.result }}
          ANDROID_CHECK: ${{ needs.android-check.result }}
          MODULE_INVENTORY: ${{ needs.module-inventory.result }}
        shell: bash
        run: |
          {
            echo "# WHITE AI ALL CHECK"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Secret scan | $SECRET_SCAN |"
            echo "| Backend checks | $PYTHON_CHECK |"
            echo "| Android checks | $ANDROID_CHECK |"
            echo "| Module inventory | $MODULE_INVENTORY |"
            echo
            echo "Security audits remain blocking. No vulnerability is ignored or downgraded."
            echo "RF hardware tests require physical hardware and an authorized test setup; this workflow does not claim to perform those tests."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SECRET_SCAN" != "success" || "$PYTHON_CHECK" != "success" || "$ANDROID_CHECK" != "success" || "$MODULE_INVENTORY" != "success" ]]; then
            echo "ALL CHECK FAILED. Review the job logs and uploaded inventory report."
            exit 1
          fi
