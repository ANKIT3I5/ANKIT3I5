name: WHITE AI Security Guard

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan repository changes for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-security:
    name: Python dependency and code security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: white-ai-mvp-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: white-ai-mvp-backend/requirements.txt
      - name: Install backend requirements and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit bandit
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Scan backend Python code
        run: bandit -q -r app -ll

  android-dependency-security:
    name: Android dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: white-ai-mvp-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
          cache-dependency-path: white-ai-mvp-android/package.json
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Diagnose flagged Android dependency paths
        if: always()
        run: |
          echo "Resolved direct/transitive versions:"
          npm ls braces node-forge --all || true
          echo "Why braces is installed:"
          npm explain braces || true
          echo "Why node-forge is installed:"
          npm explain node-forge || true
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
