name: WHITE AI MVP Free CI

on:
  push:
    branches: ["main"]
    paths:
      - "white-ai-mvp-backend/**"
      - "white-ai-mvp-android/**"
      - ".github/workflows/azure-functions-app-python.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "white-ai-mvp-backend/**"
      - "white-ai-mvp-android/**"
      - ".github/workflows/azure-functions-app-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend install, compile and smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: white-ai-mvp-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: white-ai-mvp-backend/requirements.txt

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app

      - name: Import app and smoke-test API routes
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)

          health = client.get("/health")
          assert health.status_code == 200, health.text
          assert health.json().get("status") == "ok", health.text

          api_status = client.get("/api-status")
          assert api_status.status_code == 200, api_status.text

          billing = client.get("/billing/options")
          assert billing.status_code == 200, billing.text
          assert billing.json().get("automatic_40_percent_transfer", {}).get("enabled") is False

          chat = client.post("/chat", json={"message": "CI smoke test"})
          assert chat.status_code == 200, chat.text
          assert chat.json().get("reply"), chat.text

          print("PASS: app import, /health, /api-status, /billing/options and /chat")
          PY

  android-checks:
    name: Android Expo configuration checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: white-ai-mvp-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
          cache-dependency-path: white-ai-mvp-android/package.json

      - name: Validate package and Expo configuration JSON
        run: |
          node -e "const p=require('./package.json'); if(!p.dependencies?.expo || !p.dependencies?.['react-native']) process.exit(1); console.log('package.json OK; Expo:', p.dependencies.expo, 'React Native:', p.dependencies['react-native'])"
          node -e "const a=require('./app.json').expo; if(!a?.android?.package) process.exit(1); console.log('app.json OK; Android package:', a.android.package)"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate resolved Expo configuration
        run: npx expo config --type public

      - name: Run Expo Doctor
        run: npx expo-doctor
